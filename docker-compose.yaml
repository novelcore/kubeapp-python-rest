x-logging: &default-logging
  driver: loki
  options:
    loki-url: 'http://localhost:3100/api/prom/push'
    loki-pipeline-stages: |
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2},d{3}) (?P<message>(?s:.*))$$'

version: "3.4"

services:
  loki:
    image: grafana/loki:2.8.3
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  app-a:
    build: ./app/
    ports:
      - "8000:8000"
    depends_on:
      - loki
    environment:
      APP_NAME: "app-a"
      ZITADEL_ENABLED: "${ZITADEL_ENABLED:-false}"
      OBSERVABILITY: "${OBSERVABILITY:-false}"
      PROJECT_ID: "${PROJECT_ID}"
      ZITADEL_DOMAIN: "${ZITADEL_DOMAIN}"
      ZITADEL_TOKEN_URL: "${ZITADEL_DOMAIN}/oauth/v2/token"
      ZITADEL_AUTH_URL: "${ZITADEL_DOMAIN}/oauth/v2/authorize"
      ZITADEL_JWK_URL: "${ZITADEL_DOMAIN}/oauth/v2/keys"
      ZITADEL_REVOKE_URL: "${ZITADEL_DOMAIN}/oauth/v2/revoke"
      CLIENT_ID: "${CLIENT_ID}"
      CLIENT_SECRET: "${APP_A_CLIENT_SECRET}"
      ZITADEL_INTROSPECTION_URL: "${ZITADEL_DOMAIN}/oauth/v2/introspect"
      API_CLIENT_ID: "${API_CLIENT_ID}"
      API_CLIENT_SECRET: "${API_CLIENT_SECRET}"
      ALGORITHM: "RS256"
      HTTP_CLIENT_URL: "${ZITADEL_HOST}"
      HTTP_CLIENT_KEYS_ENDPOINT: "/oauth/v2/keys"
      HTTP_CLIENT_TOKEN: "/oauth/v2/token"
    logging: *default-logging

  app-b:
    build: ./app/
    ports:
      - "8001:8000"
    depends_on:
      - loki
    environment:
      APP_NAME: "app-b"
      ZITADEL_ENABLED: "${ZITADEL_ENABLED:-false}"
      OBSERVABILITY: "${OBSERVABILITY:-false}"
      PROJECT_ID: "${PROJECT_ID}"
      ZITADEL_DOMAIN: "${ZITADEL_DOMAIN}"
      ZITADEL_TOKEN_URL: "${ZITADEL_DOMAIN}/oauth/v2/token"
      ZITADEL_AUTH_URL: "${ZITADEL_DOMAIN}/oauth/v2/authorize"
      ZITADEL_JWK_URL: "${ZITADEL_DOMAIN}/oauth/v2/keys"
      ZITADEL_REVOKE_URL: "${ZITADEL_DOMAIN}/oauth/v2/revoke"
      CLIENT_ID: "${CLIENT_ID}"
      CLIENT_SECRET: "${APP_B_CLIENT_SECRET}"
      ZITADEL_INTROSPECTION_URL: "${ZITADEL_DOMAIN}/oauth/v2/introspect"
      API_CLIENT_ID: "${API_CLIENT_ID}"
      API_CLIENT_SECRET: "${API_CLIENT_SECRET}"
      ALGORITHM: "RS256"
      HTTP_CLIENT_URL: "${ZITADEL_HOST}"
      HTTP_CLIENT_KEYS_ENDPOINT: "/oauth/v2/keys"
      HTTP_CLIENT_TOKEN: "/oauth/v2/token"
    logging: *default-logging



  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./etc/prometheus:/workspace
    command:
      - --config.file=/workspace/prometheus.yml
      - --enable-feature=exemplar-storage
    depends_on:
      - loki
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.1.1
    command: [ "--target=all", "--storage.trace.backend=local", "--storage.trace.local.path=/var/tempo", "--auth.enabled=false" ]
    ports:
      - "14250:14250"
    depends_on:
      - loki
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./etc/grafana/:/etc/grafana/provisioning/datasources
      - ./etc/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./etc/dashboards:/etc/grafana/dashboards
    depends_on:
      - loki
      - prometheus
    logging: *default-logging
