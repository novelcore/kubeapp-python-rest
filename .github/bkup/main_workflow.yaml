name: Continues Integration

on: 
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
    paths:
      - app/**
jobs:
  extract-commit-message:
    runs-on: [self-hosted, linux, x64, novecore-1]
    outputs:
      commit_message: ${{ steps.set_commit_message.outputs.commit_message }}
    steps:
      - name: Set Commit Message
        id: set_commit_message
        run: echo "::set-output name=commit_message::${{ github.event.head_commit.message }}"

  check-commit-message:
      name: "Validate commit messaage with commitizen"
      runs-on: [self-hosted, linux, x64, novecore-1]
      needs: [extract-commit-message]
      steps:

        - name: checkout
          uses: actions/checkout@v3
          with:
            fetch-depth: 0

        - name: Switch to Current Branch
          run: git checkout ${{ github.event.pull_request.head.ref }}

        - uses: actions/setup-python@v4
          with:
            python-version: 3.11
            architecture: x64
            cache: 'pip'

        - name: Install dependencies
          run: |
            pip install -U commitizen
            pip install pre-commit
            pre-commit install
        # https://github.com/commitizen-tools/commitizen/blob/master/docs/check.md

        - name: Check commit message 
          run: |
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
            COMMIT_MESSAGE=$(git log --format=%B -n 1 $COMMIT_SHA)
            if [ -z "$COMMIT_MESSAGE" ]; then
              echo "Skipping commit message check as it is empty."
            else
              echo "Commit Message: $COMMIT_MESSAGE"
              cz check --message "$COMMIT_MESSAGE"
            fi
        - name: Check file contents
          run: |
            pre-commit run --all-files

