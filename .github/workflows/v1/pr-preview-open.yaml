name: Preview Environment Workflow - Create

on:
  pull_request:
    types:
      - synchronize
      - labeled
    paths:
      - app/**
    branches:
      - dev

jobs:
  branch_prefix_action:
    runs-on: ${{ fromJson(vars.RUNNER) }}
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Determine version bump
        if: ${{ vars.ENABLE_VERSION_BUMP == 'true' }}
        run: |
          if [[ ${{ github.head_ref }} == feature/* ]]; then
            echo "VERSION_BUMP=minor" >> $GITHUB_ENV
          elif [[ ${{ github.head_ref }} == breaking/* ]]; then
            echo "VERSION_BUMP=major" >> $GITHUB_ENV
          elif [[ ${{ github.head_ref }} == bug/* ]]; then
            echo "VERSION_BUMP=patch" >> $GITHUB_ENV
          else
            echo "VERSION_BUMP=none" >> $GITHUB_ENV
          fi
      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT

      - name: Determine label based on branch prefix
        id: determine_label
        run: |
          branch=${{ steps.extract_branch.outputs.branch }}
          if [[ $branch == maintenance/* ]]; then
            echo "label=maintenance" >> $GITHUB_OUTPUT
          elif [[ $branch == feature/* ]]; then
            echo "label=feature" >> $GITHUB_OUTPUT
          elif [[ $branch == breaking/* ]]; then
            echo "label=breaking" >> $GITHUB_OUTPUT
          elif [[ $branch == chore/* ]]; then
            echo "label=chore" >> $GITHUB_OUTPUT
          elif [[ $branch == bug/* || $branch == bugfix/* ]]; then
            echo "label=bug" >> $GITHUB_OUTPUT
          else
            echo "label=unlabeled" >> $GITHUB_OUTPUT
          fi
          
      - name: Label PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.determine_label.outputs.label }}
        run: |
          if [[ $LABEL != "unlabeled" ]]; then
            gh pr edit $PR_NUMBER --add-label $LABEL
            echo "##### PR :rocket: auto detected as: $LABEL, and will be treated as such..." >> $GITHUB_STEP_SUMMARY
          else
            echo "No matching label found for the branch prefix."
          fi


  build-scan-push:
    if: "!startsWith(github.event.head_commit.message, 'docs:')"
    runs-on: ${{ fromJson(vars.RUNNER) }}
    needs: [branch_prefix_action]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.KUBE_CORE_PAT }}"
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Login to private registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL_V2 }}
          username: ${{ secrets.CI_BOT_REGISTRY_NAME_V2 }}
          password: ${{ secrets.CI_BOT_REGISTRY_PWD_V2 }}

      - name: Check if image exists
        id: check-image
        run: |
          IMAGE_TAG="${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:preview-${{ github.event.pull_request.number }}-${{ github.sha }}"
          if docker manifest inspect $IMAGE_TAG > /dev/null 2>&1; then
            echo "Image exists"
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image does not exist"
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        if: steps.check-image.outputs.image_exists == 'false'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        if: steps.check-image.outputs.image_exists == 'false'

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v5
        if: steps.check-image.outputs.image_exists == 'false'
        with:
          context: app/
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:preview-${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Pull image
        run: |
          docker pull ${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:preview-${{ github.event.pull_request.number }}-${{ github.sha }}

  security-scan:
    if: ${{ vars.ENABLE_SECURITY_SCAN == 'true' }}
    needs: [build-scan-push]
    runs-on: ${{ fromJson(vars.RUNNER) }}
    outputs:
      scan_status: ${{ steps.report.outputs.scan_status }}
    steps:
      - name: Run Trivy vulnerability scanner
        id: scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:preview-${{ github.event.pull_request.number }}-${{ github.sha }}
          format: 'table'
          output: 'trivy-results.txt'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,config'
          exit-code: '0'
          timeout: '10m0s'
          list-all-pkgs: true
          cache: true

      - name: Process and publish scan results
        id: report
        run: |
          if grep -q "Total: 0" trivy-results.txt; then
            echo "scan_status=success" >> $GITHUB_OUTPUT
            SECURITY_SUMMARY="✅ No vulnerabilities found matching the criteria!"
          else
            echo "scan_status=failure" >> $GITHUB_OUTPUT
            SECURITY_SUMMARY="⚠️ Vulnerabilities detected - Review required"
          fi

          # Create detailed report in workflow summary
          {
            echo "# 🔒 Security Scan Results"
            echo
            echo "## Summary"
            echo "$SECURITY_SUMMARY"
            echo
            echo "## Scan Configuration"
            echo "- 🔍 Scanning for: OS and library vulnerabilities"
            echo "- ⚠️ Severity levels: CRITICAL, HIGH, MEDIUM"
            echo "- 📋 Including unfixed vulnerabilities"
            echo "- 📦 Scanning all packages"
            echo
            echo "## Detailed Results"
            echo "<details><summary>Click to expand full scan results</summary>"
            echo
            echo "\`\`\`"
            cat trivy-results.txt
            echo "\`\`\`"
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

          # Also save total counts for quick reference
          {
            echo "## Quick Statistics"
            echo "Vulnerability counts:"
            grep "Total:" trivy-results.txt >> $GITHUB_STEP_SUMMARY
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload detailed scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.txt
          retention-days: 30
      
  # TODO what do we do if security scan fails ?
  dispatch-project-preview:
    runs-on: ${{ fromJson(vars.RUNNER) }}
    needs: [build-scan-push]
    if: |
      success() && 
      contains(github.event.pull_request.labels.*.name, 'preview')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.KUBE_CORE_PAT }}"
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'
  
      - name: Sanitize PR Title
        run: python3 .github/workflows/sanitize.py "${{ github.event.pull_request.title }}"
  
      - name: Declare variables
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_ENV
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "full_image_tag=${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:preview-${{ github.event.pull_request.number }}-${{ github.sha }}" >> $GITHUB_ENV
          echo "plain_image_name=${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "app_name=${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "base_project_domain=${{ vars.BASE_PROJECT_DOMAIN }}" >> $GITHUB_ENV
          # No need to set sanitized_pr_title here as it's already set by the Python script
  
        # Add a debug step to verify variables
      - name: Debug Environment Variables
        run: |
          echo "Checking environment variables:"
          echo "sanitized_pr_title: ${{ env.sanitized_pr_title }}"
          echo "app_name: ${{ env.app_name }}"
          echo "base_project_domain: ${{ env.base_project_domain }}"

      - name: 🚀 Dispatch Kustomization Update Event
        id: dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.KUBE_CORE_PAT }}
          event-type: preview-application-create-release
          repository: ${{ github.repository_owner }}/${{vars.PROJECT_NAME}}-argo
          client-payload: >-
            {
              "version": "preview-${{ github.event.pull_request.number }}-${{ github.sha }}",
              "image": "${{ env.full_image_tag }}",
              "app_name": "${{ env.app_name }}",
              "pr_number": "${{ github.event.pull_request.number }}",
              "pr_title": "${{ github.event.pull_request.title }}",
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "plain_image_name": "${{ env.plain_image_name }}",
              "base_project_domain" : "${{ env.base_project_domain }}"
            }

      - name: Report Dispatch Output to Summary
        if: steps.dispatch.conclusion == 'success'
        run: |
          echo "## 🚀 Kustomization Update Event Dispatched" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Event Type | preview-application-create-release |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | ${{ github.repository_owner }}/${{vars.PROJECT_NAME}}-argo |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | preview-${{ github.event.pull_request.number }}-${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ env.full_image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | ${{ env.app_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Number | ${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Title | ${{ github.event.pull_request.title }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR URL | ${{ github.event.pull_request.html_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plain Image Name | ${{ env.plain_image_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Project Domain | ${{ env.base_project_domain }} |" >> $GITHUB_STEP_SUMMARY

      - name: Log dispatch details
        run: |
          echo "Dispatched preview update for PR #${{ github.event.pull_request.number }}"
          echo "App: ${{ env.app_name }}"
          echo "Image: ${{ env.full_image_tag }}"
          echo "Version: preview-${{ github.event.pull_request.number }}-${{ github.sha }}"

      - name: Comment the overview on the PR
        uses: mshick/add-pr-comment@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          message: |
            # Deployment & Security Status
      
            ## 🚀 Preview Environment Status
            The preview environment for this pull request has been deployed.
      
            ## Deployment Details:
            - **Application Name:** ${{ env.app_name }}
            - **PR Number:** ${{ github.event.pull_request.number }}
            - **PR Title:** ${{ github.event.pull_request.title }}
      
            ## Access Information:
            You can access the preview environment at:
            - https://${{ env.app_name }}-pr-${{ github.event.pull_request.number }}-${{ env.sanitized_pr_title }}.${{ env.base_project_domain }}
            
            You can browse argo cd to check the progress of your preview environment:
            - https://argocd.dev.${{ vars.BASE_PROJECT_DOMAIN }}/applications/argocd/${{ env.app_name }}-pr-${{ github.event.pull_request.number }}-${{ env.sanitized_pr_title }}?resource=
      
            ## 🔒 Security Scan Results
            ${{ vars.ENABLE_SECURITY_SCAN == 'true' && format('You can find the security report on the [Actions tab]({0}/{1}/actions/runs/{2}).', github.server_url, github.repository, github.run_id) || 'Security scanning is disabled for this kubeapp.' }}
            ${{ vars.ENABLE_SECURITY_SCAN == 'true' && 'Obviously if your actions are green ✅ the scanning did not identify any vulnerabilities.' || '' }}
      
            ## Image Information:
            - Image: `${{ env.full_image_tag }}`
            - Version: `preview-${{ github.event.pull_request.number }}-${{ github.sha }}`
      
            <details>
            <summary>ℹ️ Additional Information</summary>
            
            - Please allow a few minutes for the deployment to complete
            ${{ vars.ENABLE_SECURITY_SCAN == 'true' && '- Security scan checks for CRITICAL and HIGH severity vulnerabilities' || '' }}
            - For more details, check the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            </details>
      
            If you encounter any issues or have questions, please comment on this PR.