name: Merged to Production, Create Prod Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  REGISTRY_URL_V2: ${{ secrets.REGISTRY_URL_V2 }}
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  determine_rc_version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      rc_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.KUBE_CORE_PAT }}"
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          CURRENT_VERSION=${{ vars.DEV_VERSION }}
          STRIPPED_VERSION=${CURRENT_VERSION%-dev}
          echo "Current version: $STRIPPED_VERSION"
          echo "version=$STRIPPED_VERSION-prod" >> $GITHUB_OUTPUT
          echo "Current prod version: $STRIPPED_VERSION-prod"

  build-scan-push-amd:
    needs: determine_rc_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to private registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL_V2 }}
          username: ${{ secrets.CI_BOT_REGISTRY_NAME_V2 }}
          password: ${{ secrets.CI_BOT_REGISTRY_PWD_V2 }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push AMD64 Docker image
        uses: docker/build-push-action@v5
        with:
          context: app/
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:${{ needs.determine_rc_version.outputs.rc_version }}-amd64          
          provenance: false  # Disable attestations
          build-args: |
            REGISTRY_URL=${{ secrets.REGISTRY_URL_V2 }}
            PROJECT_NAME=${{ vars.PROJECT_NAME }}
            VERSION=${{ needs.determine_version.outputs.new_version }}

  build-scan-push-arm:
    needs: determine_rc_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to private registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL_V2 }}
          username: ${{ secrets.CI_BOT_REGISTRY_NAME_V2 }}
          password: ${{ secrets.CI_BOT_REGISTRY_PWD_V2 }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v5
        with:
          context: app/
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:${{ needs.determine_rc_version.outputs.rc_version }}-arm64          
          provenance: false  # Disable attestations
          build-args: |
            REGISTRY_URL=${{ secrets.REGISTRY_URL_V2 }}
            PROJECT_NAME=${{ vars.PROJECT_NAME }}
            VERSION=${{ needs.determine_version.outputs.new_version }}
            
  create-multiarch-manifest:
    runs-on: ubuntu-latest
    needs: [determine_rc_version, build-scan-push-amd, build-scan-push-arm]
    steps:
      - name: Install regctl
        uses: regclient/actions/regctl-installer@main

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL_V2 }}
          username: ${{ secrets.CI_BOT_REGISTRY_NAME_V2 }}
          password: ${{ secrets.CI_BOT_REGISTRY_PWD_V2 }}

      - name: Create and verify multi-arch manifest
        run: |
          MAIN_TAG="${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:${{ needs.determine_rc_version.outputs.rc_version }}"
          
          echo "Creating manifest list..."
          regctl index create \
            --ref "${MAIN_TAG}-amd64" \
            --ref "${MAIN_TAG}-arm64" \
            --media-type "application/vnd.oci.image.index.v1+json" \
            "${MAIN_TAG}"              
        
  dispatch_update:
    needs: [determine_rc_version, create-multiarch-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Kustomization Update Event
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.KUBE_CORE_PAT }}
          event-type: prod-application-update-release
          repository: ${{ github.repository_owner }}/${{ vars.PROJECT_NAME }}-argo
          client-payload: >-
            {
              "version": "${{ needs.determine_rc_version.outputs.rc_version }}",
              "image": "${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ env.APP_NAME }}:${{ needs.determine_rc_version.outputs.rc_version }}",
              "app_name": "${{ env.APP_NAME }}",
              "pr_number": "${{ github.event.pull_request.number }}",
              "pr_title": "${{ github.event.pull_request.title }}",
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "plain_image_name": "${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}",
              "base_project_domain": "${{ vars.BASE_PROJECT_DOMAIN }}"
            }

  update_version_and_tag:
    needs: [determine_rc_version, create-multiarch-manifest, dispatch_update]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.KUBE_CORE_PAT }}"
          fetch-depth: 0

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        with:
          gh-cli-version: 2.65.0 

      - name: Update version in GitHub environment
        env:
          GH_TOKEN: ${{ secrets.KUBE_CORE_PAT }}
        run: |
          gh variable set PROD_VERSION --body "${{ needs.determine_rc_version.outputs.rc_version }}"

      - name: Create Git tag
        if: ${{ vars.ENABLE_CD == 'true' }}
        run: |
          git tag -a "v${{ needs.determine_rc_version.outputs.rc_version }}" -m "Release ${{ needs.determine_rc_version.outputs.rc_version }}"
          git push origin "v${{ needs.determine_rc_version.outputs.rc_version }}"
          
      - name: Create Status Comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # Release  Status
            
            ## 🚀 Release  Creation Status
            - **Version:** ${{ needs.determine_rc_version.outputs.rc_version }}
            - **Status:** ${{ needs.create_rc_tag.result == 'success' && '✅ Success' || '❌ Failed' }}
            
            Monitor deployment progress:
            https://argocd.dev.deliberate.v2.novelcore.org/applications/argocd/${{ env.APP_NAME }}-hybrid
            
            ## Image Details:
            ```
            ${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:${{ needs.determine_rc_version.outputs.rc_version }}
            ```
            
            <details>
            <summary>ℹ️ Next Steps</summary>
            
            1. Monitor the RC deployment in ArgoCD
            2. Run your RC validation tests
            3. If tests pass, proceed with production release
            4. If tests fail, create a new RC with fixes
            </details>