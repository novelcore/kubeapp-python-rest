name: Merged to Development, Create Dev Release

on:
  pull_request:
    branches:
      - dev
    types:
      - closed

env:
  REGISTRY_URL_V2: ${{ secrets.REGISTRY_URL_V2 }}
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  determine_version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.KUBE_CORE_PAT }}"
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          CURRENT_VERSION=${{ vars.DEV_VERSION }}
          echo "Current version: $CURRENT_VERSION"
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Determine version bump type
        id: bump_type
        if: ${{ vars.ENABLE_VERSION_BUMP == 'true' }}
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          LABELS="${{ toJson(github.event.pull_request.labels.*.name) }}"
          if [[ "$BRANCH_NAME" == breaking/* ]] || [[ "$LABELS" == *"breaking-change"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == feature/* ]] || [[ "$LABELS" == *"feature"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Increment version
        id: bump_version
        if: ${{ vars.ENABLE_VERSION_BUMP == 'true' }}
        run: |
          IFS='.' read -r -a version_parts <<< "${{ steps.version.outputs.current }}"
          major="${version_parts[0]}"
          minor="${version_parts[1]}"
          patch="${version_parts[2]}"
          case "${{ steps.bump_type.outputs.type }}" in
            major)
              new_major=$((major + 1))
              NEW_VERSION="$new_major.0.0-dev"
              ;;
            minor)
              new_minor=$((minor + 1))
              NEW_VERSION="$major.$new_minor.0-dev"
              ;;
            patch)
              new_patch=$((patch + 1))
              NEW_VERSION="$major.$minor.$new_patch-dev"
              ;;
          esac
          echo "New version: $NEW_VERSION"
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

  build-scan-push-amd:
    needs: determine_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to private registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL_V2 }}
          username: ${{ secrets.CI_BOT_REGISTRY_NAME_V2 }}
          password: ${{ secrets.CI_BOT_REGISTRY_PWD_V2 }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push AMD64 Docker image
        uses: docker/build-push-action@v5
        with:
          context: app/
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:${{ needs.determine_version.outputs.new_version }}-amd64
          provenance: false  # Disable attestations
          build-args: |
            REGISTRY_URL=${{ secrets.REGISTRY_URL_V2 }}
            PROJECT_NAME=${{ vars.PROJECT_NAME }}
            VERSION=${{ needs.determine_version.outputs.new_version }}
            
  build-scan-push-arm:
    needs: determine_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to private registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL_V2 }}
          username: ${{ secrets.CI_BOT_REGISTRY_NAME_V2 }}
          password: ${{ secrets.CI_BOT_REGISTRY_PWD_V2 }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v5
        with:
          context: app/
          platforms: linux/arm64 
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:${{ needs.determine_version.outputs.new_version }}-arm64
          provenance: false  # Disable attestations
          build-args: |
            REGISTRY_URL=${{ secrets.REGISTRY_URL_V2 }}
            PROJECT_NAME=${{ vars.PROJECT_NAME }}
            VERSION=${{ needs.determine_version.outputs.new_version }}

  create-multiarch-manifest:
    runs-on: ubuntu-latest
    needs: [determine_version, build-scan-push-amd, build-scan-push-arm]
    steps:
      - name: Install regctl
        uses: regclient/actions/regctl-installer@main

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL_V2 }}
          username: ${{ secrets.CI_BOT_REGISTRY_NAME_V2 }}
          password: ${{ secrets.CI_BOT_REGISTRY_PWD_V2 }}

      - name: Create and verify multi-arch manifest
        run: |
          MAIN_TAG="${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}:${{ needs.determine_version.outputs.new_version }}"
          
          echo "Creating manifest list..."
          regctl index create \
            --ref "${MAIN_TAG}-amd64" \
            --ref "${MAIN_TAG}-arm64" \
            --media-type "application/vnd.oci.image.index.v1+json" \
            "${MAIN_TAG}"          
        
  update_version_and_tag:
    needs: [determine_version, build-scan-push-arm, build-scan-push-amd, create-multiarch-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.KUBE_CORE_PAT }}"
          fetch-depth: 0

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        with:
          gh-cli-version: 2.65.0 

      - name: Update version in GitHub environment
        env:
          GH_TOKEN: ${{ secrets.KUBE_CORE_PAT }}
        run: |
          gh variable set DEV_VERSION --body "${{ needs.determine_version.outputs.new_version }}"

      - name: Create Git tag
        if: ${{ vars.ENABLE_CD == 'true' }}
        run: |
          git tag -a "v${{ needs.determine_version.outputs.new_version }}" -m "Release ${{ needs.determine_version.outputs.new_version }}"
          git push origin "v${{ needs.determine_version.outputs.new_version }}"

  dispatch_update:
    needs: [determine_version, build-scan-push-arm, build-scan-push-amd,create-multiarch-manifest, update_version_and_tag]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Kustomization Update Event
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.KUBE_CORE_PAT }}
          event-type: dev-application-update-release
          repository: ${{ github.repository_owner }}/${{ vars.PROJECT_NAME }}-argo
          client-payload: >-
            {
              "version": "${{ needs.determine_version.outputs.new_version }}",
              "image": "${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ env.APP_NAME }}:${{ needs.determine_version.outputs.new_version }}",
              "app_name": "${{ env.APP_NAME }}",
              "pr_number": "${{ github.event.pull_request.number }}",
              "pr_title": "${{ github.event.pull_request.title }}",
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "plain_image_name": "${{ secrets.REGISTRY_URL_V2 }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}",
              "base_project_domain": "${{ vars.BASE_PROJECT_DOMAIN }}"
            }
        